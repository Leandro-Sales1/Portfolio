<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem isso o padding do Hero cai sob a Dynamic Island e o
         home indicator do iPhone. O Hero compensa com env(safe-area-inset-*) nas
         classes de padding — ver Hero.jsx. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Favicon "Borda acesa": a esfera do hero, sem moldura. O SVG é o principal;
         o .ico (16/32/48) cobre navegadores sem SVG, e o apple-touch-icon (180px,
         fundo #050505) fica na raiz porque o iOS o procura lá. -->
    <link rel="icon" type="image/svg+xml" href="/imagens/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/imagens/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Meta tags fixas em PT: o `<html>` é lang="pt-br" e o PT é o idioma padrão.
         Elas NÃO acompanham o toggle de idioma — o App.jsx só sincroniza o
         document.documentElement.lang. Limitação registrada no CLAUDE.md. -->
    <title>Leandro Sales — Engenheiro de Software Full Stack</title>
    <meta
      name="description"
      content="Engenheiro de Software Full Stack com experiência em aplicações web e mobile usando React, Next.js, React Native, TypeScript, Node.js e Python. APIs REST, integrações, fluxos e orquestração de IA com Claude ou Codex."
    />
    <meta name="author" content="Leandro Sales" />
    <meta name="theme-color" content="#050505" />

    <link rel="canonical" href="https://leandro-sales-portfolio.vercel.app/" />

    <!-- Preview de link (WhatsApp, LinkedIn, Discord, X...). Três regras:
         1. URL ABSOLUTA: os crawlers não resolvem "/imagens/..." de forma confiável.
         2. A imagem é um derivado de public/imagens/Portfolio.png em 1200x630 JPG
            (<300 kB — o WhatsApp descarta imagens maiores e o preview some).
         3. Para trocar a imagem, gere um arquivo com NOME NOVO: os crawlers cacheiam
            por URL, e reusar o nome mantém a miniatura antiga por semanas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Leandro Sales" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://leandro-sales-portfolio.vercel.app/" />
    <meta property="og:title" content="Leandro Sales — Engenheiro de Software Full Stack" />
    <meta
      property="og:description"
      content="Engenheiro de Software Full Stack: aplicações web e mobile com React, Next.js, React Native, TypeScript, Node.js e Python."
    />
    <meta property="og:image" content="https://leandro-sales-portfolio.vercel.app/imagens/og-portfolio-2026-09.jpg" />
    <meta property="og:image:secure_url" content="https://leandro-sales-portfolio.vercel.app/imagens/og-portfolio-2026-09.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hero do portfólio de Leandro Sales com a esfera de partículas 3D" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leandro Sales — Engenheiro de Software Full Stack" />
    <meta
      name="twitter:description"
      content="Engenheiro de Software Full Stack: aplicações web e mobile com React, Next.js, React Native, TypeScript, Node.js e Python."
    />
    <meta name="twitter:image" content="https://leandro-sales-portfolio.vercel.app/imagens/og-portfolio-2026-09.jpg" />
    <meta name="twitter:image:alt" content="Hero do portfólio de Leandro Sales com a esfera de partículas 3D" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#050505] text-zinc-100 antialiased overflow-x-hidden font-light selection:bg-accent/20 selection:text-white"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
